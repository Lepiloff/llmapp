services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmmarket}
      POSTGRES_USER: ${POSTGRES_USER:-llmmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmmarket}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bind to localhost only — accessible to host psql, not to the LAN.
    # Other services reach it as `postgres:5432` over the docker network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmmarket} -d ${POSTGRES_DB:-llmmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    # No host port — Redis is reachable only inside the docker network
    # (web/worker/beat use `redis://redis:6379`). For host access run:
    #   docker compose exec redis redis-cli
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host access is useful for local smoke checks, but the app port must
      # not be exposed publicly on the EC2 instance. Caddy reaches web:8000
      # over the private Docker network.
      - "127.0.0.1:8000:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: ${SITE_DOMAIN:-llmappmarket.com}", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler=django_celery_beat.schedulers:DatabaseScheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Production edge proxy. Caddy obtains and renews Let's Encrypt
  # certificates automatically once DNS points at this host and ports
  # 80/443 are open in the EC2 security group.
  caddy:
    image: caddy:2.11-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-llmappmarket.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production

  # Periodic pg_dump runner. Production-only profile so dev / CI don't
  # spin it up. Dumps land in the pg_backups named volume; if
  # PG_BACKUP_S3_BUCKET is configured (with AWS creds), the script also
  # uploads each dump there before trimming local retention to
  # PG_BACKUP_RETENTION_DAYS (default 14).
  #
  # Uses a pre-built image (docker/Dockerfile.pg_backup) with both
  # pg_dump and awscli baked in. Avoids the previous pattern of
  # apt-installing at container start, which would block the service
  # when Debian mirrors are slow/down during an incident — exactly the
  # window we need backups the most.
  pg_backup:
    build:
      context: ./docker
      dockerfile: Dockerfile.pg_backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PG_BACKUP_DIR: /backups
      PG_BACKUP_RETENTION_DAYS: ${PG_BACKUP_RETENTION_DAYS:-14}
      PG_BACKUP_INTERVAL_SECONDS: ${PG_BACKUP_INTERVAL_SECONDS:-86400}
      PG_BACKUP_S3_BUCKET: ${PG_BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      # Bind-mount the script on top of the image's copy so operators
      # can patch retention / interval logic without rebuilding.
      - ./docker/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - pg_backups:/backups
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
  media_files:
  static_files:
  pg_backups:
  caddy_data:
  caddy_config:
