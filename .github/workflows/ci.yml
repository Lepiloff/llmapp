name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: llmmarket
          POSTGRES_USER: llmmarket
          POSTGRES_PASSWORD: llmmarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmmarket -d llmmarket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://llmmarket:llmmarket@127.0.0.1:5432/llmmarket
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-secret-key-not-used-anywhere
      AGENT_MONTHLY_BUDGET_USD: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enable pg_trgm extension
        run: |
          PGPASSWORD=llmmarket psql -h 127.0.0.1 -U llmmarket -d llmmarket \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest
        run: pytest -q

      - name: Verify prod settings boot with required env
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ${{ secrets.CI_PROD_SECRET || 'ci-prod-secret-not-real' }}
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
        run: python -c "import django; django.setup(); print('prod settings boot OK')"
