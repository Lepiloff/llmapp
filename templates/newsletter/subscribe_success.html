{% extends "base.html" %}
{% block title %}Check your inbox · {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-24 text-center">
  <div class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-cyan-400 to-violet-400 text-slate-950 shadow-glow-cyan">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
  </div>
  <p class="mt-6 font-mono text-[11px] uppercase tracking-widest text-cyan-300">// awaiting confirmation</p>
  <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-100">Check your inbox</h1>
  <p class="mt-3 text-slate-400">
    We sent a confirmation link. Click it to activate your subscription.
  </p>
  <div class="mt-8">
    <a href="/" class="inline-flex items-center gap-1.5 rounded-md border border-edge-strong px-4 py-2 text-sm text-slate-200 hover:border-cyan-400/40 hover:text-cyan-300 transition">Back to home</a>
  </div>
</section>
{% endblock %}
