{% extends "base.html" %}
{% block title %}Unsubscribed · {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-24 text-center">
  <p class="font-mono text-[11px] uppercase tracking-widest text-slate-400">// connection terminated</p>
  <h1 class="mt-3 text-3xl font-semibold tracking-tight text-slate-100">You've been unsubscribed.</h1>
  <p class="mt-3 text-slate-400">No more emails. You can resubscribe any time.</p>
  <div class="mt-8">
    <a href="/" class="inline-flex items-center gap-1.5 rounded-md border border-edge-strong px-4 py-2 text-sm text-slate-200 hover:border-cyan-400/40 hover:text-cyan-300 transition">Back to home</a>
  </div>
</section>
{% endblock %}
